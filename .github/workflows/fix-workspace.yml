name: Create Workspace

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check user + orgs + members
        run: |
          echo "=== user ==="
          pnpm exec wrangler d1 execute DB --remote --command "SELECT id, email, role FROM user"
          echo "=== organization ==="
          pnpm exec wrangler d1 execute DB --remote --command "SELECT id, name, slug FROM organization"
          echo "=== member ==="
          pnpm exec wrangler d1 execute DB --remote --command "SELECT user_id, org_id, role FROM member"
