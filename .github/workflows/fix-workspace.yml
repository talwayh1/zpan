name: Check Quotas

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check quotas
        run: |
          echo "=== org_quotas ==="
          pnpm exec wrangler d1 execute DB --remote --command "SELECT * FROM org_quotas"
          echo "=== system_options ==="
          pnpm exec wrangler d1 execute DB --remote --command "SELECT key, value FROM system_options WHERE key LIKE '%default%' OR key LIKE '%quota%'"
