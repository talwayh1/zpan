name: Register R2 in D1

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Insert R2 storage into D1
        run: |
          ENDPOINT="https://eb1fb7cd6098540c1c3cb764fea33f8e.r2.cloudflarestorage.com"
          pnpm exec wrangler d1 execute DB --remote --command "
            INSERT OR IGNORE INTO storages (name, type, endpoint, bucket, access_key, secret_key, mode, created_at, updated_at)
            VALUES ('Cloudflare R2', 's3', '$ENDPOINT', 'zpan-files', '$R2_ACCESS_KEY', '$R2_SECRET_KEY', 'private', datetime('now'), datetime('now'))
          "
          echo "R2 storage registered!"

      - name: Verify
        run: |
          pnpm exec wrangler d1 execute DB --remote --command "SELECT id, name, type, endpoint, bucket FROM storages"
