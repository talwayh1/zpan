name: Register R2 in D1

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_AK: ${{ secrets.R2_ACCESS_KEY }}
      R2_SK: ${{ secrets.R2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Insert R2 storage into D1
        run: |
          NOW=$(date +%s)
          SQL="INSERT OR IGNORE INTO storages
            (id, title, mode, bucket, endpoint, region, access_key, secret_key,
             file_path, custom_host, status, created_at, updated_at,
             capacity, used, egress_credit_billing_enabled, egress_credit_unit_bytes, egress_credit_per_unit)
            VALUES
            ('r2_cloudflare', 'Cloudflare R2', 'private', 'zpan-files',
             'https://eb1fb7cd6098540c1c3cb764fea33f8e.r2.cloudflarestorage.com',
             'auto', 'AKPLACEHOLDER', 'SKPLACEHOLDER',
             '\$UID/\$RAW_NAME', '', 'active', $NOW, $NOW,
             10737418240, 0, 0, 104857600, 1)"
          SQL=$(echo "$SQL" | sed "s|AKPLACEHOLDER|$R2_AK|g")
          SQL=$(echo "$SQL" | sed "s|SKPLACEHOLDER|$R2_SK|g")
          echo "$SQL" | pnpm exec wrangler d1 execute DB --remote --command "$(cat)"
          echo "R2 storage registered!"

      - name: Verify
        run: |
          pnpm exec wrangler d1 execute DB --remote --command "SELECT id, title, endpoint, bucket FROM storages"
